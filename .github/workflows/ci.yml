# CI: the Fragiola project jobs. From Dockable (fragiola/dockable, .github/workflows/ci.yml).
#
#   Checks            Biome, the source layout and the generated command reference (`pnpm check`),
#                     TypeScript, the unit tests and the build (with the .d.ts check).
#   Package           `pnpm check:package`: builds and packs every package with pnpm, lints the
#                     tarballs (dist-only exports, publint, attw), checks each adapter pins the
#                     core's exact version, then installs each adapter into its own scratch app
#                     outside the workspace that builds and loads its dev server (React's,
#                     Vue's and Angular's).
#   Changesets        on a pull request, `pnpm changeset status` fails when the PR changes what a
#                     package ships (`changedFilePatterns` in .changeset/config.json) without
#                     adding a changeset. Skipped for the Version Packages PR (changeset-release/*),
#                     which consumes them.
#   Changes           the E2E suites the pull request can affect (scripts/e2e-suites.ts, a `git
#                     diff` against the base; Epic #74, from fragiola/data-grid): none for docs only
#                     (site/docs, *.md, AGENTS.md); packages/react or examples/react: the
#                     playground and examples react; packages/vue or examples/vue: examples vue;
#                     packages/angular or examples/angular: examples angular; anything else (the
#                     core, examples/shared, the playground, the lockfile, root configs, .github,
#                     scripts, site) and a manual run: every suite. It also lists the frameworks
#                     with an examples app (every `examples/<framework>` with a
#                     playwright.config.ts: React, Vue and Angular).
#   E2E               the Playwright suites it selects, in parallel jobs, in Playwright's image
#                     (mcr.microsoft.com/playwright, the tag of @playwright/test: no browser
#                     install; Epic #74): the playground (its fixtures, shell and scenarios, in
#                     Chromium, against its dev server, which serves the packages from source) and
#                     one job per framework's examples app, each running the shared specs of
#                     examples/shared/e2e against its own embed, built against the packages' dist.
#                     No shards: add `--shard` only for a suite whose tests take more than ~3 min.
#   Site export       fragiola.com builds /tree from `pnpm site:export` (contract v1.2,
#                     fragiola/www CONTRACT.md), built and validated the way www's deploy runs
#                     it: it fails on anything www would reject.
#   Trigger www build on a push to main, asks fragiola/www to rebuild fragiola.com (a
#                     repository_dispatch of type "project-updated"). It needs the
#                     WWW_DISPATCH_TOKEN secret: a fine-grained token with Contents: read &
#                     write on fragiola/www, created by the maintainer. Without the secret the step
#                     is skipped, not failed.
#
# Tests run only on pull requests (and on a manual run). A push to main runs nothing but the www
# trigger: with one coordinator merging one PR at a time, main is what its PR tested. The same push
# also runs release.yml, which does nothing until the maintainer enables it (docs/releasing.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  package:
    name: Package
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # builds the packages first, then packs, lints and smoke-tests the tarballs
      - run: pnpm check:package

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--since` diffs from the merge base with the base branch: the full history is needed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # the root's tools only (@changesets/cli): the check reads the packages' manifests and git
      - run: pnpm install --frozen-lockfile --filter "{.}"

      - name: A changeset for every package change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"

  # The E2E suites the pull request can affect (scripts/e2e-suites.ts): the E2E jobs run only what it
  # selects. It also lists the frameworks with an examples app (every examples/<framework> with a
  # playwright.config.ts; examples/shared, the specs every framework runs, has none): adding an app
  # adds its job. An empty selection runs no examples job.
  changes:
    name: Changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      playground: ${{ steps.suites.outputs.playground }}
      examples: ${{ steps.suites.outputs.examples }}
    steps:
      # a pull request checks out its merge commit: its first parent is the base it merges into
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: suites
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            node scripts/e2e-suites.ts --diff HEAD^1
          else
            node scripts/e2e-suites.ts --all
          fi

  # The E2E jobs run in Playwright's image, whose browsers and system libraries match
  # @playwright/test (its tag follows the version; site/tests/ci-workflow.test.ts checks it), so
  # they install nothing.
  e2e-playground:
    name: E2E (playground)
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Playwright
        run: pnpm --filter playground run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-playground
          path: apps/playground/playwright-report/
          retention-days: 14

  e2e-examples:
    name: E2E (examples ${{ matrix.framework }})
    needs: changes
    if: needs.changes.outputs.examples != '[]' && needs.changes.outputs.examples != ''
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(needs.changes.outputs.examples) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The examples suite builds the embed against the packages' dist.
      - name: Build the packages
        run: pnpm --filter "./packages/*" build

      - name: Run Playwright
        run: pnpm --filter examples-${{ matrix.framework }} run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-examples-${{ matrix.framework }}
          path: examples/${{ matrix.framework }}/playwright-report/
          retention-days: 14

  site-export:
    name: Site export
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm site:export --base /tree --out "$RUNNER_TEMP/site-export"

  trigger-www-build:
    name: Trigger www build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WWW_DISPATCH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch project-updated to fragiola/www
        if: env.WWW_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.WWW_DISPATCH_TOKEN }}
        run: |
          gh api repos/fragiola/www/dispatches \
            -f event_type=project-updated \
            -f "client_payload[slug]=tree" \
            -f "client_payload[sha]=$GITHUB_SHA"
